[pytest]
# Pytest configuration for OpenManus-RL

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = test

# Coverage options (simplified - no coverage by default to speed up tests)
addopts =
    -v
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multiple components
    slow: Tests that take a long time to run
    requires_env: Tests that require environment setup (ALFWorld, WebShop, etc.)
    requires_gpu: Tests that require GPU
    asyncio: Async tests

# Ignore certain directories
norecursedirs = 
    .git
    .github
    dist
    build
    *.egg
    __pycache__
    verl
    openmanus_rl/environments/env_package

# Logging
log_cli = false
log_cli_level = INFO

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Async settings
asyncio_mode = auto
