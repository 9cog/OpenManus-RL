name: Pytest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Pytest:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 5
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy torch pytest pytest-asyncio requests
    - name: Run unit tests
      run: |
        pytest test/ -m "not requires_env and not requires_gpu and not slow" \
          --ignore=test/alfworld_rollout.py \
          --ignore=test/run_alfworld.sh \
          --ignore=test/test_rollout_env.py \
          --ignore=test/test_rollout_mock.py \
          --ignore=test/test_openmanus.py \
          --deselect="test/test_reward_computation.py::TestGIGPOAlgorithms::test_episode_norm_reward_single_trajectory" \
          -v --tb=short
